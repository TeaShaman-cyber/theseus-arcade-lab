name: qa
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: tools/dev/check
      - name: Install Timeweb Zenodo canary dependencies
        run: python -m pip install -r experiments/zenodo-timeweb-canary/requirements.txt
      - name: Smoke Timeweb Zenodo Streamable HTTP server
        env:
          PYTHONPATH: arcade/zenodo-account/src:experiments/zenodo-timeweb-canary
        run: python tools/smoke_zenodo_timeweb.py
