name: qa
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: tools/dev/check
      - name: Upload compact Langfuse plugin package
        uses: actions/upload-artifact@v4
        with:
          name: langfuse-arcade-compact
          path: |
            plugin-overlays/langfuse-arcade-portable/plugin.json
            plugin-overlays/langfuse-arcade-portable/mcp.json
            plugin-overlays/langfuse-arcade-portable/skills/**
          if-no-files-found: error
          retention-days: 7
