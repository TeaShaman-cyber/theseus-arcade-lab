[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus-zenodo-arcade"
version = "0.1.0"
description = "Scoped Arcade MCP adapter for authenticated Zenodo deposition access"
requires-python = ">=3.11"
dependencies = [
  "arcade-mcp>=1.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]
